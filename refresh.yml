name: Refresh outbound dashboard

on:
  schedule:
    # 12:00 UTC = 8:00 AM Eastern during daylight time, 7:00 AM during standard time.
    - cron: "0 12 * * *"
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Pull data and rebuild index.html
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        run: python refresh_dashboard.py

      - name: Publish if the data changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to publish."
          else
            git config user.name "dashboard-refresh"
            git config user.email "dashboard-refresh@users.noreply.github.com"
            git add index.html
            git commit -m "Refresh dashboard data $(date -u +%Y-%m-%d)"
            git push
          fi
